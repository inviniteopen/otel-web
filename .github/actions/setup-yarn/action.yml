name: "Set up Yarn"
description: >-
  Puts the repo's vendored Yarn (.yarn/releases/*.cjs) on PATH, so workflow
  steps can call `yarn` directly without corepack (node 25+ dropped the
  bundle). Version-agnostic: the release is found by glob, so bumping Yarn
  needs no change here.

runs:
  using: composite
  steps:
    - name: Put vendored Yarn on PATH
      shell: bash
      run: |
        set -euo pipefail

        release=("$GITHUB_WORKSPACE"/.yarn/releases/yarn-*.cjs)
        if [ ${#release[@]} -ne 1 ] || [ ! -f "${release[0]}" ]; then
          echo "::error::expected exactly one .yarn/releases/yarn-*.cjs, found: ${release[*]}"
          exit 1
        fi

        # Shim rather than an alias/function: each workflow step is a fresh shell,
        # so `yarn` has to be a real executable on PATH to survive between steps.
        # GITHUB_PATH is prepended, so this shadows the runner's preinstalled
        # Yarn 1.x (which ignores yarnPath in .yarnrc.yml and would misread the
        # Yarn 4 lockfile).
        mkdir -p "$RUNNER_TEMP/yarn-bin"
        printf '#!/usr/bin/env bash\nexec node "%s" "$@"\n' "${release[0]}" \
          > "$RUNNER_TEMP/yarn-bin/yarn"
        chmod +x "$RUNNER_TEMP/yarn-bin/yarn"
        echo "$RUNNER_TEMP/yarn-bin" >> "$GITHUB_PATH"

        echo "vendored Yarn $(node "${release[0]}" --version) on PATH"
